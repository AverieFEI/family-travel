<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存储管理 · 家庭旅行</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(160deg,#fdf6ec,#e8f4f8); min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; color: #334; }
  .card { background: #fff; border-radius: 22px; box-shadow: 0 24px 70px rgba(40,70,90,.14); padding: 34px 30px; width: min(460px, 100%); }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #889; margin-bottom: 22px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 13px 4px; border-bottom: 1px dashed #e3e8ee; font-size: 15px; }
  .row b { font-size: 17px; }
  .hint { font-size: 12px; color: #9aa5b1; margin-top: 8px; line-height: 1.7; }
  button { width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 14px; background: linear-gradient(135deg,#ff8a5c,#ff5c8a); color: #fff; font-size: 16px; cursor: pointer; transition: .2s; }
  button:hover { filter: brightness(1.07); }
  button:disabled { background: #cfd6de; cursor: not-allowed; }
  #result { margin-top: 14px; font-size: 14px; padding: 12px 14px; border-radius: 10px; display: none; line-height: 1.6; }
  .good { background: #e8f8ee; color: #1c7c46; display: block !important; }
  .warn { background: #fdeeee; color: #b33; display: block !important; }
  .muted { color: #889; font-size: 13px; margin-top: 16px; text-align: center; }
  a { color: #ff5c8a; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🧹 云端存储管理</h1>
  <p class="sub">查看数据库占用 · 一键清理删除记录后残留的无主照片</p>

  <div id="stats">正在读取数据库占用情况…</div>

  <button id="cleanBtn" disabled>🧹 一键清理无主照片</button>
  <p class="hint">「无主照片」＝已被你删除的记录里残留的照片文件，它们不再被任何记录引用，删除安全、不影响现有记录。清理后数据库空间会真正释放。</p>

  <div id="result"></div>
  <p class="muted"><a href="/">← 返回网站首页</a></p>
</div>

<script>
const BASE = location.origin;
const $ = (s) => document.querySelector(s);
const MB = (n) => (n / 1048576).toFixed(1) + " MB";

async function loadStats() {
  try {
    const r = await fetch(BASE + "/api/storage");
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "读取失败");
    if (!d.pg) {
      $("#stats").innerHTML = `<div class="row"><span>当前是本地文件模式</span><b>无需清理</b></div>`;
      return;
    }
    const pct = Math.min(100, (d.mb.db / 1024) * 100).toFixed(0);
    $("#stats").innerHTML = `
      <div class="row"><span>数据库总占用</span><b>${d.mb.db} MB <small style="color:#889;font-size:12px">/ 上限 1024 MB（${pct}%）</small></b></div>
      <div class="row"><span>照片/视频占用</span><b>${d.mb.assets} MB（${d.assets.count} 个文件）</b></div>
      <div class="row"><span>最大单个文件</span><b>${MB(d.assets.maxBytes)}</b></div>
      <div class="row"><span>记录数据</span><b>${d.mb.state} MB（${d.recordCount} 条记录）</b></div>
      <div class="row"><span>可清理的无主照片</span><b style="color:${d.orphanBytes > 0 ? "#c0392b" : "#1c7c46"}">${d.mb.orphan} MB（${d.orphanCount} 个）</b></div>`;
    const hasToken = !!localStorage.getItem("ft_cloud_token");
    if (d.orphanBytes > 0 && hasToken) {
      $("#cleanBtn").disabled = false;
    } else if (d.orphanBytes === 0) {
      $("#result").className = "good";
      $("#result").textContent = "没有需要清理的无主照片。若空间仍然不足，请到旅行记录里删除一些大视频，或联系部署助手。";
    } else if (!hasToken) {
      $("#result").className = "warn";
      $("#result").textContent = "请先在网站上登录你的账号，再回到本页面清理。";
    }
  } catch (e) {
    $("#stats").innerHTML = `<div class="row" style="color:#b33">读取失败：${e.message}</div>`;
  }
}

$("#cleanBtn").addEventListener("click", async () => {
  const btn = $("#cleanBtn");
  btn.disabled = true; btn.textContent = "🧹 清理中，请稍等…";
  try {
    const r = await fetch(BASE + "/api/storage/cleanup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: localStorage.getItem("ft_cloud_token") })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "清理失败");
    $("#result").className = "good";
    $("#result").textContent = `✅ 清理完成：删除 ${d.removed} 个无主照片，释放 ${d.freedMB} MB 空间。`;
    btn.textContent = "🧹 再体检一次";
    btn.disabled = false;
    loadStats();
  } catch (e) {
    $("#result").className = "warn";
    $("#result").textContent = "清理失败：" + e.message;
    btn.disabled = false; btn.textContent = "🧹 重新尝试清理";
  }
});

loadStats();
</script>
</body>
</html>
